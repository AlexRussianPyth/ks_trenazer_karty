<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каналсервис — Тренажёр карт</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Экран загрузки -->
  <div id="splash" class="splash">
    <img src="assets/sign.svg" alt="Каналсервис" class="splash__sign">
    <div class="splash__title">Тренажёр карт</div>
    <div class="splash__sub">Москва и Санкт-Петербург · до 200 км</div>
  </div>

  <!-- Главный экран -->
  <section id="screen-home" class="screen screen--home">
    <header class="home-header">
      <img src="assets/logo-with-descriptor.svg" alt="Каналсервис" class="home-header__logo">
      <div class="home-header__stats">
        <div class="stat-chip" title="Общий счёт">
          <span class="stat-chip__icon stat-chip__icon--score"></span>
          <span id="total-score">0</span>
        </div>
        <div class="stat-chip" title="Звёзды">
          <span class="stat-chip__icon stat-chip__icon--star"></span>
          <span id="total-stars">0/21</span>
        </div>
      </div>
    </header>

    <h1 class="home-title">Тренажёр карт<br><span>районы и города в радиусе 200 км</span></h1>

    <div id="levels" class="levels"></div>

    <h2 class="home-subtitle">Достижения</h2>
    <div id="achievements" class="achievements"></div>
  </section>

  <!-- Игровой экран -->
  <section id="screen-game" class="screen screen--game hidden">
    <div class="game-top">
      <button id="btn-exit" class="btn btn--ghost" title="Выйти в меню">← Меню</button>
      <div class="game-info">
        <div id="game-level-name" class="game-info__level"></div>
        <div class="game-info__bar">
          <div id="progress-dots" class="progress-dots"></div>
        </div>
      </div>
      <div class="game-stats">
        <div id="lives" class="lives" title="Жизни"></div>
        <div class="score-panel">
          <div id="score" class="score-panel__score">0</div>
          <div id="combo" class="score-panel__combo hidden">×1</div>
        </div>
      </div>
    </div>

    <div class="game-body">
      <div id="map" class="map"></div>

      <div class="question-card">
        <div class="question-card__timer">
          <div id="timer-bar" class="question-card__timer-fill"></div>
        </div>
        <div id="question-text" class="question-card__text"></div>
        <div id="question-hint" class="question-card__hint"></div>
        <div id="options" class="options hidden"></div>
        <div id="feedback" class="question-card__feedback"></div>
      </div>
    </div>
  </section>

  <!-- Экран результата -->
  <section id="screen-result" class="screen screen--result hidden">
    <div class="result-card">
      <div id="result-stars" class="result-stars"></div>
      <h2 id="result-title" class="result-card__title"></h2>
      <div id="result-score" class="result-card__score"></div>
      <p id="result-text" class="result-card__text"></p>
      <div id="result-achievements" class="result-achievements"></div>
      <div class="result-card__buttons">
        <button id="btn-retry" class="btn btn--ghost">Ещё раз</button>
        <button id="btn-to-menu" class="btn btn--primary">К уровням</button>
      </div>
    </div>
  </section>

  <div id="toast" class="toast hidden"></div>
  <canvas id="confetti" class="confetti"></canvas>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/bitrix24.js"></script>
</body>
</html>
